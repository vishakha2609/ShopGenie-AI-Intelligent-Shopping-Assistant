<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ShopGenie Store</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:#f5f7fb;
    color:#333;
}

header{
    background:linear-gradient(135deg,#4f46e5,#7c3aed);
    color:white;
    text-align:center;
    padding:30px 20px;
}

header h1{
    font-size:2.2rem;
}

header p{
    margin-top:10px;
}

.controls{
    max-width:1100px;
    margin:30px auto;
    display:flex;
    justify-content:space-between;
    gap:15px;
    flex-wrap:wrap;
}

.controls input,
.controls select{
    padding:12px;
    border-radius:8px;
    border:1px solid #ccc;
    width:250px;
    font-size:15px;
}

.products{
    max-width:1100px;
    margin:auto;
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:25px;
    padding-bottom:50px;
}

.card{
    background:white;
    border-radius:15px;
    overflow:hidden;
    box-shadow:0 8px 20px rgba(0,0,0,.08);
    transition:.3s;
}

.card:hover{
    transform:translateY(-8px);
    box-shadow:0 12px 25px rgba(0,0,0,.15);
}

.card img{
    width:100%;
    height:220px;
    object-fit:cover;
}

.info{
    padding:18px;
}

.category{
    color:#7c3aed;
    font-size:14px;
    font-weight:bold;
}

.info h3{
    margin:8px 0;
}

.price{
    font-size:22px;
    color:#4f46e5;
    font-weight:bold;
}

button{
    width:100%;
    margin-top:15px;
    padding:12px;
    border:none;
    background:#4f46e5;
    color:white;
    border-radius:8px;
    cursor:pointer;
    transition:.3s;
}

button:hover{
    background:#312e81;
}

footer{
    background:#1f2937;
    color:white;
    text-align:center;
    padding:20px;
}
</style>

</head>
<body>

<header>
<h1>🛒 ShopGenie Store</h1>
<p>Simple E-Commerce Product Page</p>
</header>

<div class="controls">

<input type="text" id="search" placeholder="Search Product...">

<select id="filter">
<option value="all">All Categories</option>
<option value="electronics">Electronics</option>
<option value="fashion">Fashion</option>
<option value="home">Home</option>
</select>

</div>

<div class="products" id="products">

<div class="card" data-category="electronics">
<img src="https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?w=600" alt="">
<div class="info">
<div class="category">Electronics</div>
<h3>Smartphone</h3>
<p class="price">₹24,999</p>
<button onclick="buy('Smartphone')">Buy Now</button>
</div>
</div>

<div class="card" data-category="fashion">
<img src="https://images.unsplash.com/photo-1523381210434-271e8be1f52b?w=600" alt="">
<div class="info">
<div class="category">Fashion</div>
<h3>Casual Jacket</h3>
<p class="price">₹1,999</p>
<button onclick="buy('Casual Jacket')">Buy Now</button>
</div>
</div>

<div class="card" data-category="electronics">
<img src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=600" alt="">
<div class="info">
<div class="category">Electronics</div>
<h3>Wireless Headphones</h3>
<p class="price">₹3,499</p>
<button onclick="buy('Headphones')">Buy Now</button>
</div>
</div>

<div class="card" data-category="home">
<img src="https://images.unsplash.com/photo-1505693416388-ac5ce068fe85?w=600" alt="">
<div class="info">
<div class="category">Home</div>
<h3>Table Lamp</h3>
<p class="price">₹899</p>
<button onclick="buy('Table Lamp')">Buy Now</button>
</div>
</div>

</div>

<footer>
<p>© 2026 ShopGenie Store | TechnoHacks Internship Task</p>
</footer>

<script>

function buy(product){
    alert(product + " added successfully!");
}

const search=document.getElementById("search");
const filter=document.getElementById("filter");
const cards=document.querySelectorAll(".card");

function filterProducts(){

const text=search.value.toLowerCase();
const category=filter.value;

cards.forEach(card=>{

const title=card.querySelector("h3").textContent.toLowerCase();
const cat=card.dataset.category;

const matchTitle=title.includes(text);
const matchCategory=category==="all" || category===cat;

card.style.display=(matchTitle && matchCategory)?"block":"none";

});

}

search.addEventListener("keyup",filterProducts);
filter.addEventListener("change",filterProducts);

</script>
